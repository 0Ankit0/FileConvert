version: '3.9'
services:
  backend:
    image: python:3.12-slim
    working_dir: /app
    command: bash -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ../backend:/app
    env_file:
      - .env
    depends_on:
      - redis

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ../frontend:/app
    env_file:
      - .env

  worker:
    image: python:3.12-slim
    working_dir: /app
    command: bash -c "pip install -r requirements.txt && celery -A app.workers.celery_app.celery_app worker -l info"
    volumes:
      - ../backend:/app
    env_file:
      - .env
    depends_on:
      - redis

  redis:
    image: redis:7-alpine

  reverse-proxy:
    image: nginx:1.27-alpine
    ports:
      - '8080:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
